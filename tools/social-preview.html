<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1280px;height:640px;overflow:hidden;font-family:-apple-system,"Helvetica Neue",sans-serif;color:#14110F;
background:#FFFDF7 radial-gradient(rgba(20,17,15,.10) 1.4px,transparent 1.8px) 0 0/11px 11px;display:flex;align-items:center;gap:56px;padding:0 72px;box-sizing:border-box}
.l{flex:1;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:18px;font-family:"Bricolage Grotesque";font-weight:800;font-size:64px;letter-spacing:-.03em}
.brand img{width:96px;height:96px;border-radius:22px;border:4px solid #14110F}
h1{margin:0;font-family:"Bricolage Grotesque";font-weight:800;font-size:58px;line-height:1;letter-spacing:-.02em}
p{margin:0;font-size:26px;font-weight:600}
.pill{align-self:flex-start;padding:8px 18px;border:3px solid #14110F;border-radius:999px;background:#FFD23F;font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.page{display:grid;grid-template-columns:repeat(2,230px);gap:10px;padding:10px;background:#fff;border:4px solid #14110F;box-shadow:10px 10px 0 #14110F;transform:rotate(-2deg)}
.page img{width:230px;height:230px;object-fit:cover;border:3px solid #14110F;box-sizing:border-box}

<div class="l"><div class="brand"><img src="../docs/images/icon-512.png">ikkoma</div>

</body></html>
